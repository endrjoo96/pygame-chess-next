mode: PROD
log:
  level: WARN
game:
  seed: ""
ui:
  action_animation_duration_ms: 500
ai:
  search:
    max_depth: 7
    time_limit_seconds: 15.0
    cpu:
      workers: 4
      worker_usage: 75
    ponder:
      enabled: true
      cpu:
        worker_usage: 15
    cache:
      enabled: true
      max_entries: 8k
    learning:
      enabled: true
      save_enabled: true
      database_path: move-learning.sqlite3
      max_file_size: 16G
      soft_cutoff_threshold: -20
    metrics:
      enabled: false
